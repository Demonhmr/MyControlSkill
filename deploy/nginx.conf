# Обратный прокси на nginx — вариант для тех, у кого он уже стоит.
# Сертификат придётся получать отдельно (certbot); с Caddy этого не нужно.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/mycontrolskill
#   sudo ln -s /etc/nginx/sites-available/mycontrolskill /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Замените домен и пути к сертификатам; домен должен совпадать с MCS_BASE_URL.

server {
    listen 80;
    listen [::]:80;
    server_name compass.example.com;

    # Единственное, что отдаётся по http, — подтверждение владения доменом.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name compass.example.com;

    ssl_certificate     /etc/letsencrypt/live/compass.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/compass.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Ссылка на анкету видна в адресной строке респондента: с полным Referer
    # она утекала бы на любой внешний ресурс, открытый со страницы.
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Анкета целиком уходит одним запросом: 19 компетенций и 10 деструкторов
    # по два пункта плюс открытые ответы. Предела по умолчанию хватает, но
    # запас не помешает.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Адрес клиента дописывается в конец списка — сервис берёт именно
        # последнее значение, поэтому подделанный клиентом заголовок его не
        # перебивает. Требует MCS_TRUST_PROXY=true.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
